# Fullsend agent harness: npm-recipe-draft.
#
# `agent` must point to a single agent-definition markdown file (relative to
# .fullsend/), not a directory — bootstrap uploads it to the sandbox as
# <agent-name>.md.
agent: npm-recipe-draft/CLAUDE.md
role: coder

# Model access. Without this the sandbox has no LLM credentials and Claude Code
# exits immediately ("Not logged in"), producing no recipe-result.json. A local
# harness must declare it (stock agents get it from their URL-sourced harness).
# `vertex-ai` resolves to providers/vertex-ai.yaml, whose profile opens sandbox
# egress to api.anthropic.com + *.googleapis.com; both are shipped in-repo since
# providers/ and profiles/ aren't in the dispatch layered-dirs set.
providers:
    - vertex-ai

# Files mounted into the sandbox:
# - the GCP Vertex credentials (from the runner's WIF Setup GCP step) and the
#   .env.d file (expand: true) that enables Vertex mode;
# - the agent's INPUT: the deterministic facts file the pre-script writes.
#
# The facts file must be `optional: true`: fullsend stat-checks every `src`
# BEFORE the pre-script runs but copies files in AFTER, so it doesn't exist yet
# at check time. `src` is expanded with the runner PROCESS env (not env.runner),
# so this path is shared verbatim with pre-recipe-facts.sh. The agent reads it
# at $RECIPE_INPUT_FILE (env.sandbox).
host_files:
    - src: env/gcp-vertex.env
      dest: /sandbox/workspace/.env.d/gcp-vertex.env
      expand: true
    - src: ${GOOGLE_APPLICATION_CREDENTIALS}
      dest: /tmp/.gcp-credentials.json
    - src: ${GCP_OIDC_TOKEN_FILE}
      dest: /sandbox/workspace/.gcp-oidc-token
      optional: true
    - src: /tmp/fullsend-npm-recipe-draft/recipe-input.json
      dest: /sandbox/workspace/recipe-input.json
      optional: true

# Pre-script: the deterministic fact provisioner. Runs on the runner (outside
# the sandbox) before the sandbox is created; a non-zero exit aborts the run. It
# resolves the target identity (RECIPE_PACKAGE or the /fs-onboard comment) and
# writes the facts to the path host_files copies in — so the credential-less
# agent receives facts as data and never fabricates them. An unknown/invalid
# package yields facts_available: false (agent emits needs_human); only genuine
# infra faults fail the run. The path must live under .fullsend/ (traversal
# guard); the script derives the repo root from its own location.
pre_script: npm-recipe-draft/pre-recipe-facts.sh

# Inline validation loop (ADR 0022): fullsend extracts agent output only from
# /sandbox/workspace/output/. This script fails fast (with retry) when the agent
# writes recipe-result.json elsewhere, and sets FULLSEND_VALIDATED_ITERATION_DIR
# for post-recipe-validate.sh.
validation_loop:
    script: npm-recipe-draft/validate-recipe-result.sh
    schema: ../npm-recipe-draft/schemas/recipe-result.schema.json
    max_iterations: 2

# Agent I/O env. FULLSEND_OUTPUT_FILE names the result file the agent writes and
# the post-script reads. RECIPE_INPUT_FILE lets the agent reference its input by
# variable instead of hard-coding the sandbox path; it must match the host_files
# `dest` above.
env:
    runner:
        FULLSEND_OUTPUT_FILE: recipe-result.json
        REGISTRY_REPO_FULL_NAME: calungaproject/npm-registry
        KITCHEN_REPO_FULL_NAME: calungaproject/npm-recipe-kitchen
    sandbox:
        RECIPE_INPUT_FILE: /sandbox/workspace/recipe-input.json
        RECIPE_PACKAGES_BASE: packages
        FULLSEND_OUTPUT_DIR: /sandbox/workspace/output
        FULLSEND_OUTPUT_FILE: recipe-result.json

# Deterministic safety gate. Runs on the runner after the agent exits; a
# non-zero exit blocks the result. It re-runs the semantic validator (schema +
# template allowlist + source-SHA match + parameter safety) against the agent's
# recipe-result.json before anything is acted on. Same .fullsend/ traversal
# guard and repo-root derivation as the pre-script.
post_script: npm-recipe-draft/post-recipe-validate.sh

# Dispatch trigger (CEL over the normalized event): the /fs-onboard command
# comment on a work item. A harness with no trigger is manual-run-only.
trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-onboard"
    && event.entity.kind == "work_item"
