# Fullsend agent harness: npm-recipe-draft
# Validated against fullsend v0.36.0 harness loader.
# The `agent` field must point to a single agent-definition MARKDOWN FILE
# (relative to .fullsend/), not a directory: the bootstrap scanner reads it
# with os.ReadFile and uploads it to the sandbox as <agent-name>.md. Pointing
# at a directory fails bootstrap with "read ...: is a directory".
agent: npm-recipe-draft/CLAUDE.md
role: coder

# Agent output filename. Exported into the sandbox so the agent writes to
# $FULLSEND_OUTPUT_DIR/recipe-result.json, and read back by the post-script.
runner_env:
    FULLSEND_OUTPUT_FILE: recipe-result.json

# Deterministic safety gate. Runs on the RUNNER (outside the sandbox) after the
# agent exits, with cwd = the run directory. Fullsend blocks the result (marks
# the run failed) if this exits non-zero. It re-runs the repo's semantic
# validator (schema + template allowlist + source-SHA match + parameter safety)
# against the agent's recipe-result.json before anything is acted on.
#
# The path must live under .fullsend/ — fullsend's path resolver rejects any
# reference that escapes the .fullsend directory (traversal guard). The script
# locates the repo root from its own location to reach scripts/lib/*.mjs.
post_script: npm-recipe-draft/post-recipe-validate.sh

# Dispatch trigger: a CEL expression over NormalizedEvent.
# fullsend dispatch only selects a harness whose trigger is a non-empty CEL
# expression; a harness with no trigger is manual-run-only and is excluded
# from dispatch (see ADR 0061 / CEL Triggers Reference, v0.36.0).
# This selects the /fs-onboard command comment on a work item.
trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-onboard"
    && event.entity.kind == "work_item"
