# This file is managed by fullsend. Do not edit it directly.
# Upstream: https://github.com/fullsend-ai/fullsend/blob/main/internal/scaffold/fullsend-repo/.github/workflows/fullsend.yaml
---
# fullsend shim workflow (per-repo installation mode)
# Routes events to agent workflows via reusable-dispatch.yml.
# All agent execution happens in this repo's context — no external
# config repo is needed.
#
# Security: pull_request_target runs the BASE branch version of this workflow,
# preventing PRs from modifying it to exfiltrate credentials.
# This shim never checks out PR code, so it is not vulnerable to "pwn request"
# attacks.
#
# Routing: this shim forwards the raw event context to reusable-dispatch.yml,
# which determines the stage and runs the agent inline (ADR 62).
# Adding a new stage requires only a job in reusable-dispatch.yml — zero changes to this repo.
#
# Concurrency: per-role cancel-in-progress groups live in reusable-dispatch.yml
# stage jobs with -agent- suffix. Roles operate independently (#2452).
name: fullsend

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  # /fs-onboard: authorize + matrix here, then call upstream reusable-dispatch so
  # harness-run mints via the enrolled workflow OIDC identity (inline fullsend run
  # in this file returns HTTP 401 from the mint service). Registry PRs for drafted
  # outcomes are handled by npm-recipe-registry-publish job below.
  npm-recipe-onboard-prepare:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue != null
      && (
        github.event.comment.body == '/fs-onboard'
        || startsWith(github.event.comment.body, '/fs-onboard ')
        || startsWith(github.event.comment.body, format('{0}\n', '/fs-onboard'))
      )
      && (
        github.event.comment.user.type != 'Bot'
        || contains(join(github.event.issue.labels.*.name, ','), 'npm-priority-candidate')
      )
    runs-on: ubuntu-24.04
    concurrency:
      group: fullsend-harness-npm-recipe-draft-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Authorize /fs-onboard
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMMAND=""
          if [[ -n "${COMMENT_BODY:-}" ]]; then
            COMMAND="$(printf '%s\n' "${COMMENT_BODY}" | head -1 | tr -d '\r' | awk '{print $1}')"
          fi
          if [[ "${COMMAND}" != "/fs-onboard" ]]; then
            echo "::notice::Skipping: first token is '${COMMAND:-<empty>}', expected /fs-onboard"
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${COMMENT_USER_LOGIN}" ]]; then
            echo "::error::Cannot authorize /fs-onboard: comment user login is empty"
            exit 1
          fi
          api_err="$(mktemp)" || {
            echo "::error::Cannot authorize /fs-onboard: failed to create temp file for permission check"
            exit 1
          }
          trap 'rm -f -- "${api_err}"' EXIT
          if ! role="$(gh api "repos/${REPO}/collaborators/${COMMENT_USER_LOGIN}/permission" \
              --jq '.role_name' 2>"${api_err}")"; then
            echo "::error::Permission API call failed for ${COMMENT_USER_LOGIN}: $(cat "${api_err}")"
            exit 1
          fi
          authorized=false
          case "${role}" in
            admin|maintain|write) authorized=true ;;
          esac
          if [[ "${authorized}" != "true" && "${COMMENT_USER_LOGIN}" == *"[bot]" ]]; then
            label_json="$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.labels[].name' 2>/dev/null || true)"
            if [[ "${label_json}" == *"npm-priority-candidate"* ]]; then
              authorized=true
            fi
          fi
          if [[ "${authorized}" != "true" ]]; then
            echo "::notice::User ${COMMENT_USER_LOGIN} is not authorized to run /fs-onboard (requires write access)"
            if [[ "${COMMENT_USER_LOGIN}" != *"[bot]" ]]; then
              gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" \
                --body "Cannot run \`/fs-onboard\`: @${COMMENT_USER_LOGIN} does not have write access to \`${REPO}\`."
            fi
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "authorized=true" >> "${GITHUB_OUTPUT}"

      - name: Build harness matrix
        id: matrix
        if: steps.authorize.outputs.authorized == 'true'
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          MATRIX="$(jq -nc \
            --arg agent "npm-recipe-draft" \
            --arg role "coder" \
            --arg source_repo "${GITHUB_REPOSITORY}" \
            --arg event_type "issue_comment" \
            --arg event_payload "${EVENT_PAYLOAD}" \
            --arg status_repo "${GITHUB_REPOSITORY}" \
            --arg status_number "${{ github.event.issue.number }}" \
            '{include:[{agent:$agent,role:$role,source_repo:$source_repo,event_type:$event_type,event_payload:$event_payload,status_repo:$status_repo,status_number:$status_number}]}')"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  npm-recipe-onboard-run:
    needs: npm-recipe-onboard-prepare
    if: needs.npm-recipe-onboard-prepare.outputs.authorized == 'true'
    # Reusable workflows inherit the caller job's permissions ceiling; match dispatch.
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    with:
      matrix: ${{ needs.npm-recipe-onboard-prepare.outputs.matrix }}
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # Registry PR for drafted outcomes. harness-run (upstream reusable-dispatch) cannot
  # receive REGISTRY_PUSH_TOKEN, so post-recipe-validate.sh defers when
  # DEFER_REGISTRY_PUBLISH=true. Artifacts are uploaded by the fullsend composite
  # action as fullsend-npm-recipe-draft from the harness workflow run. The publish
  # job lists candidates created after this workflow run started, then selects the
  # artifact whose registry-publish-request.json matches this issue (and harness_run_id).
  npm-recipe-registry-publish:
    needs: [npm-recipe-onboard-prepare, npm-recipe-onboard-run]
    if: needs.npm-recipe-onboard-prepare.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout config repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download fullsend artifact for this issue
        id: harness
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.run_id }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ -z "${EVENT_ISSUE_NUMBER}" ]]; then
            echo "::error::npm-recipe-registry-publish requires an issue_comment trigger with issue.number"
            exit 1
          fi
          parent_started="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}" \
            --jq '.run_started_at')"
          mapfile -t candidate_run_ids < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=fullsend-npm-recipe-draft" \
            | jq -r --arg since "${parent_started}" '
              [.artifacts[]
               | select(.expired == false)
               | select(.created_at >= $since)
              ] | sort_by(.created_at) | reverse | .[].workflow_run.id
            ')
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT
          harness_run_id=""
          for run_id in "${candidate_run_ids[@]}"; do
            rm -rf "${probe_dir:?}"/*
            if ! gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name fullsend-npm-recipe-draft \
              --dir "${probe_dir}" 2>/dev/null; then
              continue
            fi
            request_file="${probe_dir}/registry-publish-request.json"
            if [[ ! -f "${request_file}" ]]; then
              continue
            fi
            req_issue="$(jq -r '.issue_number // empty' "${request_file}")"
            req_harness="$(jq -r '.harness_run_id // empty' "${request_file}")"
            if [[ "${req_issue}" != "${EVENT_ISSUE_NUMBER}" ]]; then
              continue
            fi
            if [[ -n "${req_harness}" && "${req_harness}" != "${run_id}" ]]; then
              continue
            fi
            harness_run_id="${run_id}"
            cp -a "${probe_dir}/." .
            break
          done
          if [[ -z "${harness_run_id}" ]]; then
            echo "::error::Could not find fullsend-npm-recipe-draft artifact for issue #${EVENT_ISSUE_NUMBER} from workflow run ${PARENT_RUN_ID}"
            exit 1
          fi
          echo "run_id=${harness_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish registry PR
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          REGISTRY_PR_TOKEN: ${{ secrets.REGISTRY_PR_TOKEN }}
          REGISTRY_PUSH_REPO_FULL_NAME: ${{ vars.REGISTRY_PUSH_REPO_FULL_NAME }}
          EXPECTED_REGISTRY_REPO: calungaproject/npm-registry
          KITCHEN_REPO_FULL_NAME: ${{ github.repository }}
          KITCHEN_GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-registry-bundle.sh registry-publish-request.json registry-bundle

  dispatch:
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review'
       || github.event.pull_request.head.ref != 'fullsend/scaffold-install')
      && (github.event_name != 'issue_comment'
       || github.event.comment.user.type != 'Bot')
      && (github.event_name != 'issue_comment'
       || github.event.comment.body == ''
       || !(
         github.event.comment.body == '/fs-onboard'
         || startsWith(github.event.comment.body, '/fs-onboard ')
         || startsWith(github.event.comment.body, format('{0}\n', '/fs-onboard'))
       ))
      && (github.event_name != 'issues'
       || (
         !contains(join(github.event.issue.labels.*.name, ','), 'npm-priority-candidate')
         && !contains(join(github.event.issue.labels.*.name, ','), 'npm-onboard')
         && !contains(join(github.event.issue.labels.*.name, ','), 'npm-priority-queue-run')
       ))
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    with:
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  stop-fix:
    # Job-level if: is intentionally coarse — it only screens for the
    # /fs-fix-stop command on a PR from a non-bot. The authoritative
    # authorization decision (collaborator permission API + PR-author escape
    # hatch) is made in the step below, so a maintainer whose author_association
    # is not MEMBER (e.g. private org membership) is not filtered out (ADR 0054).
    if: >-
      github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && github.event.comment.body == '/fs-fix-stop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Add fullsend-no-fix label and notify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          # ADR 0054: authorize via the collaborator permission API
          # (admin|maintain|write), not author_association — the latter grants
          # contributor status to anyone with a single merged PR (issue #5421).
          # Mirrors has_repo_permission() in dispatch.yml; keep the two in sync.
          # The PR author may always stop the fix agent on their own PR.
          authorized=false
          if [[ -n "$COMMENT_USER_LOGIN" && "$COMMENT_USER_LOGIN" == "$ISSUE_USER_LOGIN" ]]; then
            authorized=true
          else
            if api_err=$(mktemp); then
              if role=$(gh api "repos/$REPO/collaborators/$COMMENT_USER_LOGIN/permission" \
                --jq '.role_name' 2>"$api_err"); then
                case "$role" in
                  admin|maintain|write) authorized=true ;;
                esac
              else
                echo "::warning::Permission API call failed for $COMMENT_USER_LOGIN: $(cat "$api_err")"
              fi
              rm -f "$api_err"
            else
              echo "::warning::Failed to create temp file for permission check of $COMMENT_USER_LOGIN"
            fi
          fi
          if [[ "$authorized" != "true" ]]; then
            echo "::notice::User $COMMENT_USER_LOGIN is not authorized to stop the fix agent (requires write access or PR authorship)"
            exit 0
          fi
          gh label create "fullsend-no-fix" --repo "$REPO" \
            --description "Skip bot-triggered fix agent runs" --color "FBCA04" \
            --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" \
            --add-label "fullsend-no-fix"
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Fix agent disabled for this PR. Remove the \`fullsend-no-fix\` label or use \`/fs-fix\` to re-engage."
