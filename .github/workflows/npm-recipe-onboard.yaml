# Dedicated /fs-onboard runner for npm-recipe-draft.
#
# Stock fullsend harness-run mints PUSH_TOKEN for the workflow repo only
# (npm-recipe-kitchen). post-recipe-validate.sh pushes drafted bundles to
# calungaproject/npm-registry, so the coder token must include both repos.
# fullsend run honors MINT_REPOS when it is in the process environment at
# mint time; harness-run does not set it, so this workflow mirrors harness-run
# and exports MINT_REPOS before invoking the agent.
---
name: npm-recipe-onboard

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  run:
    if: >-
      github.event.issue != null
      && github.event.comment.user.type != 'Bot'
      && github.event.comment.body != ''
      && matches(split(github.event.comment.body, '\n')[0], '^/fs-onboard(\s.*)?$')
    runs-on: ubuntu-24.04
    concurrency:
      group: fullsend-harness-npm-recipe-draft-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      FULLSEND_VERSION: 84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    steps:
      - name: Authorize /fs-onboard
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Match fullsend dispatch: first-line slash command, not a substring.
          COMMAND=""
          if [[ -n "${COMMENT_BODY:-}" ]]; then
            COMMAND="$(printf '%s\n' "${COMMENT_BODY}" | head -1 | tr -d '\r' | awk '{print $1}')"
          fi
          if [[ "${COMMAND}" != "/fs-onboard" ]]; then
            echo "::notice::Skipping: first token is '${COMMAND:-<empty>}', expected /fs-onboard"
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # ADR 0054: authorize via collaborator permission API (admin|maintain|write),
          # not author_association — mirrors reusable-dispatch.yml is_authorized().
          authorized=false
          if [[ -n "${COMMENT_USER_LOGIN}" ]]; then
            if api_err=$(mktemp); then
              if role=$(gh api "repos/${REPO}/collaborators/${COMMENT_USER_LOGIN}/permission" \
                --jq '.role_name' 2>"${api_err}"); then
                case "${role}" in
                  admin|maintain|write) authorized=true ;;
                esac
              else
                echo "::warning::Permission API call failed for ${COMMENT_USER_LOGIN}: $(cat "${api_err}")"
              fi
              rm -f "${api_err}"
            else
              echo "::warning::Failed to create temp file for permission check of ${COMMENT_USER_LOGIN}"
            fi
          fi

          if [[ "${authorized}" != "true" ]]; then
            echo "::notice::User ${COMMENT_USER_LOGIN} is not authorized to run /fs-onboard (requires write access)"
          fi
          echo "authorized=${authorized}" >> "${GITHUB_OUTPUT}"

      - name: Checkout config repository
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout fullsend defaults
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fullsend-ai/fullsend
          ref: ${{ env.FULLSEND_VERSION }}
          path: .defaults
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/
            .github/scripts/
            internal/scaffold/fullsend-repo/
            action.yml

      - name: Prepare workspace
        if: steps.authorize.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          SRC=".defaults/internal/scaffold/fullsend-repo"
          for dir in agents skills schemas harness plugins policies scripts env; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p ".fullsend/${dir}"
              cp -r "${SRC}/${dir}/." ".fullsend/${dir}/"
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh

      - name: Write dispatch event payload
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          mkdir -p .fullsend/dispatch
          printf '%s' "${EVENT_PAYLOAD}" > .fullsend/dispatch/event-payload.json

      - name: Mint checkout token
        if: steps.authorize.outputs.authorized == 'true'
        id: app-token
        uses: ./.defaults/.github/actions/mint-token
        with:
          role: coder
          repos: npm-recipe-kitchen
          mint_url: ${{ vars.FULLSEND_MINT_URL }}

      - name: Checkout target repository
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Setup GCP and prepare credentials
        if: steps.authorize.outputs.authorized == 'true'
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          fullsend-dir: .fullsend

      - name: Setup agent environment
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        env:
          AGENT_PREFIX: CODER_
          CODER_TARGET_REPO_DIR: target-repo
          CODER_ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CODER_CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
          FULLSEND_REPO_VARS: ${{ toJSON(vars) }}
        run: bash .github/scripts/setup-agent-env.sh

      - name: Run npm-recipe-draft harness
        if: steps.authorize.outputs.authorized == 'true'
        uses: ./.defaults/
        env:
          GITHUB_ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          # Scope the coder PUSH_TOKEN to both repos the post-script touches.
          MINT_REPOS: npm-recipe-kitchen,npm-registry
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_CERTIFICATE: ${{ vars.OTEL_EXPORTER_OTLP_CERTIFICATE }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_SDK_DISABLED: ${{ vars.OTEL_SDK_DISABLED }}
        with:
          agent: npm-recipe-draft
          version: ${{ env.FULLSEND_VERSION }}
          fullsend-dir: .fullsend
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status-repo: ${{ github.repository }}
          status-number: ${{ github.event.issue.number }}
          status-comment-id: ${{ github.event.comment.id }}
          mint-url: ${{ vars.FULLSEND_MINT_URL }}
