# Pull-request CI for the focused recipe builder.
# Runs the deterministic validation gate on every PR to main.
# Least privilege: read-only token, no persisted git credentials.
# This workflow is independent of the fullsend shim workflow and does not
# invoke fullsend, GCP, or any registry.
---
name: ci

on:
  pull_request:
    branches: [main]

# Least privilege at the top level; jobs opt in to more only if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Check
        run: npm run check
